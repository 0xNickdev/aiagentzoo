name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Build SDK
        run: npm run build -w @aiagentzoo/sdk
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build web
        run: npm run build -w @aiagentzoo/web

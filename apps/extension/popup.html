<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>ZOOAI X-Ray</title>
  <link rel="stylesheet" href="panel.css" />
  <link rel="stylesheet" href="popup.css" />
</head>
<body class="zoo">
  <header>
    <span class="brand"><img src="icons/32.png" alt="" /><b>ZOOAI</b> X-Ray</span>
    <span class="live mono"><i></i>live · solana</span>
  </header>

  <form id="form">
    <input id="mint" class="mono" placeholder="token address or link" spellcheck="false" autocomplete="off" />
    <button type="submit" id="go">X-ray</button>
  </form>

  <section id="out"></section>
  <section id="home">
    <p class="lead">Open a token on pump.fun, DexScreener, gmgn, Axiom, Photon or BullX and the X-Ray shows up on the page. On X, token addresses in posts get their verdict next to them.</p>
    <div id="watch-wrap" hidden>
      <p class="label mono">alerts on</p>
      <div id="watch" class="list"></div>
    </div>
    <div id="hist-wrap" hidden>
      <p class="label mono">recent</p>
      <div id="hist" class="list"></div>
    </div>
  </section>

  <footer class="mono">read straight from the chain · not financial advice · <a href="https://zooaiagency.com/xray" target="_blank" rel="noopener">zooaiagency.com</a></footer>
  <script src="shared.js"></script>
  <script src="panel.js"></script>
  <script src="popup.js"></script>
</body>
</html>
